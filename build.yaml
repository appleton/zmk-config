# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano@2.0.0//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9//zmk
#   - board: nice_nano@2.0.0//zmk
#     shield: reviung41
#   - board: nice_nano@2.0.0//zmk
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nrf52840dongle/nrf52840/zmk
    shield: ergodash_dongle
    artifact-name: ergodash-dongle-raytac-mdbt50q-cx
  - board: nice_nano@2.0.0//zmk
    shield: ergodash_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ERGODASH_BATTERY_SIDE=0
    artifact-name: ergodash-left-peripheral-nice-nano-v2
  - board: nice_nano@2.0.0//zmk
    shield: ergodash_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ERGODASH_BATTERY_SIDE=1
    artifact-name: ergodash-right-peripheral-nice-nano-v2
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: settings-reset-nice-nano-v2
  - board: nrf52840dongle/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings-reset-raytac-mdbt50q-cx
